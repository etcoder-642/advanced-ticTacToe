<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header class="header">
        <h1>Advanced TicTacToe</h1>
        <div class="nav complex-mode">Complex Mode</div>
    </header>
    <div class="overlay"></div>
    <div class="message-box">
        <div class="message-text"></div>
        <div class="message-box-btn">
            <button class='rem-pop'>See Board</button>
            <button class='reset-pop'>Restart Game</button>
        </div>
    </div>
    <div class="head-content">
        <div class="human-mode">Human Mode</div>
        <div class="computer-mode">Computer Mode</div>
    </div>
    <div class="container">
        <div class="wrapper w1">
            <div class="space" id="00"></div>   
            <div class="space" id="01"></div>
            <div class="space" id="02"></div>
        </div>
        <div class="wrapper w2">
            <div class="space" id="10"></div>
            <div class="space" id="11"></div>
            <div class="space" id="12"></div>
        </div>
        <div class="wrapper w3">
            <div class="space" id="20"></div>
            <div class="space" id="21"></div>
            <div class="space" id="22"></div>
        </div>
    </div>
    <div class="bottom-section">
        <button class="reset-btn">Reset Game</button>
    </div>
</body>

</html>
